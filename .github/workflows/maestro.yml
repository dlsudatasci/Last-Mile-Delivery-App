name: Maestro E2E Tests

on:
  push:
    branches:
      - test/e2e
  workflow_dispatch:

jobs:
  maestro:
    name: Run Maestro E2E Tests
    runs-on: ubuntu-latest

    env:
      MAPBOX_DOWNLOAD_TOKEN: ${{ secrets.MAPBOX_DOWNLOAD_TOKEN }}
      EXPO_PUBLIC_MAPBOX_KEY: ${{ secrets.EXPO_PUBLIC_MAPBOX_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android

      - name: Verify Firebase Android config
        run: |
          echo "=== Root Firebase config ==="
          ls -l google-services.json

          echo "=== Generated Android Firebase config ==="
          ls -l android/app/google-services.json

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Verify Maestro
        run: maestro --version

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          force-avd-creation: true
          script: |
            adb devices
            cd android && ./gradlew assembleDebug
            echo "=== Generated Google Services resources ==="
            find android/app/build/generated/res/google-services -type f -print
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            cd ..
            npx expo start --dev-client --host lan > /tmp/expo.log 2>&1 &
            sleep 10
            cat /tmp/expo.log
            adb reverse tcp:8081 tcp:8081
            curl -I http://localhost:8081

            adb shell am start -W -a android.intent.action.VIEW -d "com.samg.devia://expo-development-client/?url=http://127.0.0.1:8081"
            sleep 5
            curl -I http://localhost:8081
            cat /tmp/expo.log

            adb shell dumpsys activity activities | grep -E "mResumedActivity|mCurrentFocus"
            adb logcat -d -t 500 | grep -iE "com.samg.devia|ReactNative|Expo|ReactHost|Metro|bundle|localhost|8081|error|exception"
            maestro test .maestro/onboarding/invalidRiderCode.yaml

      - name: Upload Maestro debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          path: /home/runner/.maestro/tests/
          if-no-files-found: warn